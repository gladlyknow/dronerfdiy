name: Validate full source question bank

on:
  push:
    branches:
      - feature/full-question-bank-abc
    paths:
      - '.github/workflows/validate-full-bank.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-question-bank-abc
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install, verify bank, typecheck and build
        shell: bash
        run: |
          set +e
          {
            echo '# Full source bank validation'
            echo
            echo '## Install'
          } > full-bank-validation.txt
          bun install >> full-bank-validation.txt 2>&1
          INSTALL=$?
          echo "install_exit=$INSTALL" >> full-bank-validation.txt
          echo >> full-bank-validation.txt
          echo '## Chunk diagnostics' >> full-bank-validation.txt
          bun run scripts/check-a-bank-chunks.ts >> full-bank-validation.txt 2>&1
          CHUNKS=$?
          echo "chunks_exit=$CHUNKS" >> full-bank-validation.txt
          echo >> full-bank-validation.txt
          echo '## Source bank verification' >> full-bank-validation.txt
          bun run scripts/verify-a-bank.ts >> full-bank-validation.txt 2>&1
          VERIFY=$?
          echo "verify_exit=$VERIFY" >> full-bank-validation.txt
          echo >> full-bank-validation.txt
          echo '## Typecheck' >> full-bank-validation.txt
          bun run lint >> full-bank-validation.txt 2>&1
          LINT=$?
          echo "lint_exit=$LINT" >> full-bank-validation.txt
          echo >> full-bank-validation.txt
          echo '## Build' >> full-bank-validation.txt
          bun run build >> full-bank-validation.txt 2>&1
          BUILD=$?
          echo "build_exit=$BUILD" >> full-bank-validation.txt
          echo >> full-bank-validation.txt
          echo '## Dist' >> full-bank-validation.txt
          find dist -maxdepth 4 -type f -printf '%p %s bytes\n' 2>/dev/null | sort >> full-bank-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- full-bank-validation.txt bun.lock
          git commit -m 'chore: record full bank validation [skip validation]' || true
          git push origin HEAD:feature/full-question-bank-abc
          if [ "$INSTALL" -ne 0 ] || [ "$CHUNKS" -ne 0 ] || [ "$VERIFY" -ne 0 ] || [ "$LINT" -ne 0 ] || [ "$BUILD" -ne 0 ]; then
            exit 1
          fi
