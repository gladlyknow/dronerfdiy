name: Validate R2 ABC integration

on:
  push:
    branches:
      - feature/r2-abc-authoritative
    paths:
      - '.github/workflows/validate-r2-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r2-abc-authoritative
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install and validate
        shell: bash
        run: |
          set +e
          {
            echo '# R2 ABC integration validation'
            echo
            echo '## Install'
          } > r2-integration-validation.txt
          bun install >> r2-integration-validation.txt 2>&1
          INSTALL=$?
          echo "install_exit=$INSTALL" >> r2-integration-validation.txt
          echo >> r2-integration-validation.txt
          echo '## Authoritative bank verification' >> r2-integration-validation.txt
          bun run verify:banks >> r2-integration-validation.txt 2>&1
          VERIFY=$?
          echo "verify_exit=$VERIFY" >> r2-integration-validation.txt
          echo >> r2-integration-validation.txt
          echo '## Typecheck' >> r2-integration-validation.txt
          bun run lint >> r2-integration-validation.txt 2>&1
          LINT=$?
          echo "lint_exit=$LINT" >> r2-integration-validation.txt
          echo >> r2-integration-validation.txt
          echo '## Build' >> r2-integration-validation.txt
          bun run build >> r2-integration-validation.txt 2>&1
          BUILD=$?
          echo "build_exit=$BUILD" >> r2-integration-validation.txt
          echo >> r2-integration-validation.txt
          echo '## Dist' >> r2-integration-validation.txt
          find dist -maxdepth 4 -type f -printf '%p %s bytes\n' 2>/dev/null | sort >> r2-integration-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- r2-integration-validation.txt bun.lock
          git commit -m 'chore: record R2 ABC integration validation [skip validation]' || true
          git push origin HEAD:feature/r2-abc-authoritative
          if [ "$INSTALL" -ne 0 ] || [ "$VERIFY" -ne 0 ] || [ "$LINT" -ne 0 ] || [ "$BUILD" -ne 0 ]; then
            exit 1
          fi
