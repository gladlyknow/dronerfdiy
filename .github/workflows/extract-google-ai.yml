name: Extract Google AI project

on:
  push:
    branches:
      - review/google-ai-import
    paths:
      - '.github/workflows/extract-google-ai.yml'
      - '业余无线电-a-证考试全景知识图谱.zip'

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip extract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/google-ai-import
          fetch-depth: 0

      - name: Extract archive into isolated review directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .review/google-ai
          mkdir -p .review/google-ai
          unzip -q '业余无线电-a-证考试全景知识图谱.zip' -d .review/google-ai
          rm -rf .review/google-ai/.git
          find .review/google-ai -type d -name node_modules -prune -exec rm -rf {} + || true
          find .review/google-ai -type d -name dist -prune -exec rm -rf {} + || true

      - name: Commit extracted sources for review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .review/google-ai
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit.'
            exit 0
          fi
          git commit -m 'chore: extract Google AI project for review [skip extract]'
          git push origin HEAD:review/google-ai-import
