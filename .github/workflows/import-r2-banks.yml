name: Import authoritative R2 ABC banks

on:
  push:
    branches:
      - feature/r2-abc-authoritative
    paths:
      - 'scripts/import-r2-banks.mjs'
      - '.github/workflows/import-r2-banks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r2-abc-authoritative
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install project dependencies
        run: bun install

      - name: Download, parse and validate R2 PDFs
        run: node scripts/import-r2-banks.mjs | tee r2-bank-import-report.json

      - name: Typecheck
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Record generated source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/generated r2-bank-import-report.json bun.lock
          git commit -m 'data: import authoritative A B C banks from R2 [skip r2 import]' || true
          git push origin HEAD:feature/r2-abc-authoritative
